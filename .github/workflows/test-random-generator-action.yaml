name: 2-Test Composite Action

on:
  workflow_dispatch:

jobs:
  run-custom-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: ChrisL_Random Number Generator
        id: custom_rng
        uses: chrislambwork139/TestMarketPlace@v1.1
        with:
          user-name: 'Billy Bob from my marketplace'
      - name: use the returned number
        run: |
          echo "The composite action successfully returned the number: ${{ steps.custom_rng.outputs.generated_number }}"
